[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aitghelper"
version = "0.1.0"
description = "Personal Telegram assistant for notes, reminders, and AI-assisted message interpretation."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiogram>=3,<4",
    "SQLAlchemy>=2,<3",
    "alembic>=1,<2",
    "aiosqlite>=0.19,<1",
    "APScheduler>=3.10,<4",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "openai>=1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
]

[project.scripts]
aitghelper = "app.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py313"
